name: ndviewer_light
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy
  - tifffile
  - zarr
  - dask
  - xarray
  - superqt>=0.8.1
  - qtpy
  - vispy
  - pip
  - pip:
    - tensorstore
    # Same pin as pyproject.toml; installed via pip so the spec is identical.
    - "ndv>=0.5,<0.6"
    # qtpy resolves a binding at import time and raises QtBindingsNotFoundError
    # without one. Squid supplies its own binding (PyQt5 by default) when this viewer
    # is embedded; a standalone env (this file, used by CI and for the simulate_*
    # scripts) has to bring its own. Installed via pip rather than conda so the
    # binding is unambiguous.
    - PyQt6
