[metadata]
name = ndviewer_light
version = 0.1.0

[options]
packages = ndviewer_light
python_requires = >=3.10
# Kept in sync with [project.dependencies] in pyproject.toml (this file exists for
# old pip on Ubuntu 22.04).
install_requires =
    numpy
    tifffile
    zarr
    dask
    xarray
    superqt[iconify]>=0.8.1
    qtpy
    vispy
    pyopengl
    tensorstore
    ndv>=0.5,<0.6

[options.entry_points]
console_scripts =
    ndviewer-light = ndviewer_light.core:main
