[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ndviewer_light"
version = "0.1.0"
description = "Minimal NDV-based viewer for viewing 5-D acquisitions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "tifffile",
    "zarr",
    "dask",
    "xarray",
    # [iconify] brings pyconify, which ndv 0.5's Qt view imports (QIconifyIcon).
    "superqt[iconify]>=0.8.1",
    # qtpy, not a concrete binding: Squid runs this viewer embedded in its own process
    # under the binding it selected (PyQt5 by default, PyQt6 supported), and installing
    # a second Qt binding alongside breaks napari/vispy OpenGL rendering. The host
    # application supplies the binding.
    "qtpy",
    # vispy stays unpinned and ndv[vispy] is deliberately not used: that extra demands
    # vispy>=0.16 while napari (Squid's host) pins vispy<0.15.
    "vispy",
    # 3D volume textures (ndv lists it under the vispy extra we do not depend on).
    "pyopengl",
    "tensorstore",
    "ndv>=0.5,<0.6",
]

[project.scripts]
ndviewer-light = "ndviewer_light.core:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ndviewer_light"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "window: needs a real window and GL context (texture-level smoke); skipped when the Qt platform is offscreen, see tests/conftest.py window_qapp",
]

[project.optional-dependencies]
dev = ["ruff", "pytest"]
# qtpy is a shim, so a standalone install (running the simulate_* scripts, or this
# project's own test suite) still needs a real binding. Embedded in Squid the host
# already provides one, which is why this is an extra rather than a hard dependency:
# `pip install .[pyqt6]`, mirroring how napari ships napari[pyqt6].
pyqt6 = ["PyQt6"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# F821: undefined name - catches the bug we just fixed
# F401: unused import
# F841: unused variable
select = ["F821", "F401", "F841"]
ignore = []
