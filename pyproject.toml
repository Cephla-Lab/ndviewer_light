[build-system]
requires = ["setuptools>=45"]
build-backend = "setuptools.build_meta"

[project]
name = "ndviewer_light"
version = "0.1.0"
description = "Minimal NDV-based viewer for viewing 5-D acquisitions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "tifffile",
    "dask",
    "xarray",
    "superqt",
    # qtpy, not a concrete binding: Squid runs this viewer embedded in its own process
    # under PyQt6, and installing a second Qt binding alongside breaks napari/vispy
    # OpenGL rendering. The host application supplies the binding.
    "qtpy",
    "vispy",
    "tensorstore",
    "ndv>=0.4.0,<0.5.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ndviewer_light"]

[tool.pytest.ini_options]
pythonpath = ["."]

[project.optional-dependencies]
dev = ["ruff", "pytest"]
# qtpy is a shim, so a standalone install (running the simulate_* scripts, or this
# project's own test suite) still needs a real binding. Embedded in Squid the host
# already provides one, which is why this is an extra rather than a hard dependency:
# `pip install .[pyqt6]`, mirroring how napari ships napari[pyqt6].
pyqt6 = ["PyQt6"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# F821: undefined name - catches the bug we just fixed
# F401: unused import
# F841: unused variable
select = ["F821", "F401", "F841"]
ignore = []
