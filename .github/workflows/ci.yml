name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install black
        run: pip install 'black<26'

      - name: Check formatting with black
        run: black --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: ndviewer_light
          environment-file: environment.yml
          python-version: "3.11"
          auto-activate-base: false

      - name: Install test dependencies
        shell: bash -l {0}
        run: |
          conda activate ndviewer_light
          pip install pytest
          pip install -e .

      # The Mesa packages (libgl1, libglx-mesa0, libgl1-mesa-dri, libegl-mesa0) give
      # Xvfb a software GL context for the real-GL run below; ndv's own CI installs
      # the same set.
      - name: Install system dependencies for Qt and Mesa GL
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 libegl1 libgl1 libglx-mesa0 libgl1-mesa-dri libegl-mesa0

      # Headless path: the Qt offscreen platform (no GL context) with ndv's
      # GL_MAX_TEXTURE_SIZE query pinned by tests/conftest.py. The window smokes
      # (@pytest.mark.window) skip here.
      - name: Run tests (offscreen platform, pinned GL texture limits)
        shell: bash -l {0}
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          conda activate ndviewer_light
          xvfb-run --auto-servernum python -m pytest -v

      # Real-GL path: xcb under Xvfb with Mesa, NDVL_REAL_GL=1 keeps ndv's real
      # texture-size query, and the window smokes run (texture-level checks of the
      # push, shape-change and navigation paths).
      - name: Run tests (xcb under Xvfb, real GL query, window smokes)
        if: ${{ !cancelled() }}
        shell: bash -l {0}
        env:
          QT_QPA_PLATFORM: xcb
          NDVL_REAL_GL: "1"
        run: |
          conda activate ndviewer_light
          xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24 +extension GLX" python -m pytest -v
